name: ci-cd

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 린트
        run: npm run lint

      - name: 테스트
        run: npm test

      - name: 빌드
        run: npm run build:dev

      - name: 빌드 산출물 업로드
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: client-dist
          path: dist
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    env:
      S3_BUCKET: ${{ vars.CLIENT_S3_BUCKET }}
      CF_DISTRIBUTION_ID: ${{ vars.CLIENT_CF_DISTRIBUTION_ID }}
    steps:
      - name: 배포 대상 변수 확인
        run: |
          : "${S3_BUCKET:?CLIENT_S3_BUCKET 변수가 비어 있음}"
          : "${CF_DISTRIBUTION_ID:?CLIENT_CF_DISTRIBUTION_ID 변수가 비어 있음}"

      - name: 빌드 산출물 내려받기
        uses: actions/download-artifact@v8
        with:
          name: client-dist
          path: dist

      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ap-northeast-2
          mask-aws-account-id: true

      - name: 에셋 업로드 (해시 파일명 · 영구 캐시)
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET}/" \
            --exclude "*" --include "assets/*" \
            --size-only \
            --cache-control "public,max-age=31536000,immutable"

      - name: 루트 파일 업로드 (index.html 제외)
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET}/" \
            --exclude "assets/*" --exclude "index.html" \
            --cache-control "no-cache"

      - name: index.html 업로드 (마지막)
        run: |
          aws s3 cp dist/index.html "s3://${S3_BUCKET}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: CloudFront 무효화
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CF_DISTRIBUTION_ID}" \
            --paths / /index.html /favicon.svg \
            --query 'Invalidation.Id' --output text
